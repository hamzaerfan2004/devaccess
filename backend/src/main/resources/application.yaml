spring:
  application:
    name: devaccess-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/devaccess
    username: devaccess_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

analysis:
  service:
    base-url: http://localhost:8000